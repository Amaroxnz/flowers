<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flores ASCII</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
    #start-btn {
      position: absolute;
      padding: 14px 28px;
      font-size: 16px;
      font-family: monospace;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }
    #start-btn:hover { background: #333; }
  </style>
</head>
<body>

  <button id="start-btn">▶ Iniciar Flores ASCII</button>
  <canvas id="ascii-canvas"></canvas>

  <!-- Vídeo oculto usado como fonte -->
  <video id="source-video" src="video.mp4" loop muted playsinline crossorigin="anonymous" style="display:none;"></video>

  <script>
    const video = document.getElementById("source-video");
    const canvas = document.getElementById("ascii-canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("start-btn");

    // Canvas auxiliar invisível para ler os pixels do vídeo
    const offCanvas = document.createElement("canvas");
    const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

    // CONFIGURAÇÕES (iguais às do código Python)
    const RAMP = " .:-=+*#%@";
    const EDGES_STRENGTH = 0.35;
    const SATURATION = 1.25;
    const FONT_SIZE = 10; // Diminua para 8 se quiser mais detalhes no celular
    const CROP_TOP_ONLY = false; // Mude para true se usar o vídeo inteiro do TikTok (corta só a metade de cima)

    let cols = 0;
    let rows = 0;
    const charW = FONT_SIZE * 0.6;
    const charH = FONT_SIZE;

    function setupSize() {
      const vw = video.videoWidth || 640;
      const vh = (CROP_TOP_ONLY ? (video.videoHeight * 0.55) : video.videoHeight) || 360;

      const maxW = window.innerWidth;
      const maxH = window.innerHeight;

      const aspect = vw / vh;
      let targetW = maxW;
      let targetH = targetW / aspect;

      if (targetH > maxH) {
        targetH = maxH;
        targetW = targetH * aspect;
      }

      cols = Math.floor(targetW / charW);
      rows = Math.floor(targetH / charH);

      canvas.width = cols * charW;
      canvas.height = rows * charH;
      offCanvas.width = cols;
      offCanvas.height = rows;

      ctx.font = `bold ${FONT_SIZE}px monospace`;
      ctx.textBaseline = "top";
    }

    function boostColor(r, g, b) {
      // Aplica saturação e brilho igual ao script Python
      const max = Math.max(r, g, b, 1);
      const min = Math.min(r, g, b);
      const avg = (r + g + b) / 3;

      r = avg + (r - avg) * SATURATION;
      g = avg + (g - avg) * SATURATION;
      b = avg + (b - avg) * SATURATION;

      const scale = 255 / max;
      r = Math.min(255, Math.max(0, r * 0.4 + r * scale * 0.6));
      g = Math.min(255, Math.max(0, g * 0.4 + g * scale * 0.6));
      b = Math.min(255, Math.max(0, b * 0.4 + b * scale * 0.6));

      return `rgb(${r | 0},${g | 0},${b | 0})`;
    }

    function renderFrame() {
      if (video.paused || video.ended) return;

      const srcH = CROP_TOP_ONLY ? video.videoHeight * 0.55 : video.videoHeight;
      offCtx.drawImage(video, 0, 0, video.videoWidth, srcH, 0, 0, cols, rows);

      const frame = offCtx.getImageData(0, 0, cols, rows).data;
      const lum = new Float32Array(cols * rows);

      for (let i = 0; i < cols * rows; i++) {
        const p = i * 4;
        lum[i] = (0.299 * frame[p] + 0.587 * frame[p + 1] + 0.114 * frame[p + 2]) / 255.0;
      }

      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const edgeChars = ["-", "\\", "|", "/"];

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const i = y * cols + x;
          const l = lum[i];
          if (l < 0.06) continue;

          let ch = RAMP[Math.min(RAMP.length - 1, Math.floor(l * (RAMP.length - 1) + 0.5))];

          // Detecção de bordas Sobel simplificada
          if (EDGES_STRENGTH > 0 && x > 0 && x < cols - 1 && y > 0 && y < rows - 1) {
            const gx = -lum[i - cols - 1] + lum[i - cols + 1]
                       -2 * lum[i - 1]     + 2 * lum[i + 1]
                       -lum[i + cols - 1] + lum[i + cols + 1];
            const gy = -lum[i - cols - 1] - 2 * lum[i - cols] - lum[i - cols + 1]
                       +lum[i + cols - 1] + 2 * lum[i + cols] + lum[i + cols + 1];

            const mag = Math.hypot(gx, gy) / 4.0;
            if (mag > (0.8 - 0.6 * EDGES_STRENGTH) && l > 0.12) {
              const ang = (Math.atan2(gy, gx) * 180 / Math.PI + 90 + 180) % 180;
              ch = edgeChars[Math.floor(((ang + 22.5) % 180) / 45)];
            }
          }

          if (ch === " ") continue;

          const p = i * 4;
          ctx.fillStyle = boostColor(frame[p], frame[p + 1], frame[p + 2]);
          ctx.fillText(ch, x * charW, y * charH);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    startBtn.addEventListener("click", () => {
      setupSize();
      video.play();
      startBtn.style.display = "none";
      requestAnimationFrame(renderFrame);
    });

    window.addEventListener("resize", () => {
      if (!video.paused) setupSize();
    });
  </script>
</body>
</html>
